[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vtk-demo"
dynamic = ["version"]
description = "Fancy VTK / PyVista scenes and demo applications that show off VTK capabilities and performance"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sebastien Jourdain", email = "sebastien.jourdain@kitware.com" }]
keywords = ["vtk", "pyvista", "trame", "webgpu", "wasm", "visualization", "demo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy",
  "matplotlib",
  "pyvista>=0.48",
  "vtk>=9.5",
]

[project.urls]
Homepage = "https://github.com/Kitware/vtk-demo"
Source = "https://github.com/Kitware/vtk-demo"
Issues = "https://github.com/Kitware/vtk-demo/issues"
Changelog = "https://github.com/Kitware/vtk-demo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Web applications (VTK.wasm, vtk.js and server side rendering)
trame = [
  "trame>=3.12",
  "trame-vuetify",
  "trame-vtk",
  "trame-vtklocal>=1.7.2",
  "trame-pyvista>=0.2.1",
]
# Standalone HTML export (VTK.wasm bundled in one file)
export = ["trame-vtklocal>=1.7.2"]
# Native desktop applications with a Dear ImGui UI (no Python 3.10 wheels
# since imgui-bundle 1.92, and its source build fails)
imgui = ["imgui-bundle; python_version >= '3.11'"]
all = ["vtk-demo[trame,export,imgui]"]
# Task runner for development and CI (see noxfile.py)
dev = ["nox[uv]>=2025.2.9"]

[project.scripts]
vtk-demo = "vtk_demo.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/vtk_demo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vtk_demo"]

[tool.hatch.build.targets.sdist]
include = ["src/vtk_demo", "tests", "README.md", "CONTRIBUTING.md", "LICENSE"]

[tool.uv]
# VTK nightly: with 9.7.1, VTK.wasm does not mark updated arrays as modified, so
# the browser keeps drawing the first frame of trame.animation
constraint-dependencies = ["vtk==9.7.20260913.dev0"]

[tool.uv.sources]
vtk = { index = "vtk" }

[[tool.uv.index]]
name = "vtk"
url = "https://wheels.vtk.org"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
  "SIM105",
  "SIM117", # nested `with` blocks mirror the trame UI layout
]

[tool.semantic_release]
# Releases are triggered manually from the "Release" GitHub workflow
version_variables = ["src/vtk_demo/__init__.py:__version__"]
commit_parser = "conventional"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
  '''chore(?:\([^)]*?\))?: .+''',
  '''ci(?:\([^)]*?\))?: .+''',
  '''style(?:\([^)]*?\))?: .+''',
  '''test(?:\([^)]*?\))?: .+''',
  '''build\((?!deps\): .+)''',
  '''Initial [Cc]ommit.*''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
