name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uvx nox -s lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      # Off screen rendering for pyvista.Plotter(off_screen=True)
      - uses: pyvista/setup-headless-display-action@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # nox (uv backend) downloads the matrix interpreter when it is missing
      - run: uvx nox -s tests-${{ matrix.python-version }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Build and smoke test the wheel
        run: uvx nox -s build
